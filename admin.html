<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a1628" />
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
<style>
/* =========================================================
   1. Reset & Variables
   ========================================================= */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --blue:#0a66c2;
  --blue-dark:#084d94;
  --blue-soft:#eaf2fb;
  --ink:#0a1628;
  --ink-soft:#2c3e50;
  --muted:#67798c;
  --line:#e4edf5;
  --line-soft:#eef4fa;
  --bg:#f7fafd;
  --white:#fff;
  --sidebar:#0a1628;
  --sidebar-h:#162a44;
  --ok:#16a34a;
  --ok-soft:#dcfce7;
  --warn:#f59e0b;
  --warn-soft:#fef3c7;
  --err:#dc2626;
  --err-soft:#fee2e2;
  --purple:#7c3aed;
  --purple-soft:#ede9fe;
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:8px;
  --ease:cubic-bezier(.22,1,.36,1);
  --sidebar-w:250px;
  --top-h:60px;
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.65;
  font-size:14px;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--top-h) 1fr;
  grid-template-areas:"sidebar top" "sidebar main";
}

a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;-webkit-appearance:none;appearance:none}
img{max-width:100%;display:block}

/* منع Zoom على iOS عند focus على input */
@supports (-webkit-touch-callout:none){
  input,select,textarea{font-size:16px}
}

/* =========================================================
   2. Sidebar
   ========================================================= */
.sb{
  grid-area:sidebar;
  background:var(--sidebar);
  color:#c9d5e3;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
  position:sticky;
  top:0;
  height:100vh;
  height:100dvh;
  z-index:60;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.1) transparent;
}
.sb::-webkit-scrollbar{width:4px}
.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}

.sb-brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 20px;
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.sb-brand .mark{
  width:36px;height:36px;
  background:var(--blue);
  color:#fff;
  border-radius:10px;
  display:grid;place-items:center;
  font-weight:900;font-size:16px;
  flex-shrink:0;
}
.sb-brand .info{min-width:0;flex:1}
.sb-brand .info strong{
  display:block;color:#fff;font-size:14px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sb-brand .info small{
  font-size:10.5px;color:#7a8fa5;
  font-family:monospace;letter-spacing:.5px;
}
.sb-close{
  display:none;
  width:34px;height:34px;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:#c9d5e3;
  place-items:center;
  font-size:14px;
  flex-shrink:0;
}
.sb-close:hover{background:rgba(255,255,255,.15);color:#fff}

.sb-group{padding:14px 12px 0}
.sb-group:last-of-type{padding-bottom:14px}

.sb-label{
  font-size:9.5px;font-weight:900;
  letter-spacing:1.5px;
  color:#5a6e85;
  padding:0 12px 8px;
  text-transform:uppercase;
}

.sb-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:10px;
  color:#c9d5e3;font-size:13.5px;font-weight:600;
  width:100%;text-align:right;
  transition:all .2s var(--ease);
  margin-bottom:2px;
}
.sb-item:hover{background:var(--sidebar-h);color:#fff}
.sb-item.is-active{background:var(--blue);color:#fff}
.sb-item i{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.sb-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .badge{
  background:rgba(255,255,255,.1);
  font-size:10px;font-weight:800;
  padding:2px 8px;border-radius:20px;
  flex-shrink:0;
}
.sb-item.is-active .badge{background:rgba(255,255,255,.25)}

.sb-foot{
  margin-top:auto;
  padding:14px 20px;
  font-size:11px;color:#5a6e85;
  border-top:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}

/* =========================================================
   3. Top bar
   ========================================================= */
.top{
  grid-area:top;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 20px;
  position:sticky;top:0;z-index:50;
  min-height:var(--top-h);
  flex-wrap:nowrap;
}
.top-left{
  display:flex;align-items:center;gap:10px;
  min-width:0;flex:1;
}
.top-right{
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.menu-btn{
  display:none;
  width:38px;height:38px;
  border-radius:10px;
  background:var(--blue-soft);
  color:var(--blue);
  place-items:center;
  font-size:15px;
  flex-shrink:0;
  transition:background .2s;
}
.menu-btn:hover{background:#d4e6ff}

.page-title{
  font-size:15px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:800;
  padding:4px 11px;border-radius:30px;
  background:#f1f5f9;color:var(--muted);
  white-space:nowrap;flex-shrink:0;
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.saved{background:var(--ok-soft);color:#166534}
.pill.dirty{background:var(--warn-soft);color:#92400e}
.pill.err{background:var(--err-soft);color:#991b1b}

.top-actions{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}

/* =========================================================
   4. Buttons
   ========================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;
  font-size:12.5px;font-weight:700;
  transition:all .22s var(--ease);
  border:1.5px solid transparent;
  white-space:nowrap;
  font-family:inherit;
  cursor:pointer;
  min-height:38px;
  flex-shrink:0;
}
.btn i{font-size:12px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--blue-dark);transform:translateY(-1px)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn-danger{background:var(--err-soft);color:var(--err)}
.btn-danger:hover:not(:disabled){background:var(--err);color:#fff}
.btn-success{background:var(--ok-soft);color:#166534}
.btn-success:hover:not(:disabled){background:var(--ok);color:#fff}
.btn-purple{background:var(--purple-soft);color:var(--purple)}
.btn-purple:hover:not(:disabled){background:var(--purple);color:#fff}
.btn-sm{padding:6px 11px;font-size:11.5px;min-height:32px}
.btn-xs{padding:5px 8px;font-size:11px;border-radius:8px;min-height:28px;width:28px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* =========================================================
   5. Main
   ========================================================= */
.main{
  grid-area:main;
  padding:24px 28px 60px;
  overflow-x:hidden;
  max-width:1400px;
  width:100%;
}

/* =========================================================
   6. Section Titles
   ========================================================= */
.sec-title{
  font-size:20px;font-weight:900;
  margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
  line-height:1.3;
}
.sec-title i{color:var(--blue);flex-shrink:0}
.sec-desc{color:var(--muted);font-size:13.5px;margin-bottom:20px;line-height:1.6}

/* =========================================================
   7. Cards
   ========================================================= */
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:18px;
}
.card-h{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.card-h h3{
  font-size:14px;font-weight:800;
  display:flex;align-items:center;gap:9px;
  flex:1;min-width:0;
  line-height:1.4;
}
.card-h h3 i{color:var(--blue);font-size:13px;flex-shrink:0}
.card-h .actions{display:flex;gap:6px;flex-wrap:wrap}

/* =========================================================
   8. Form Fields
   ========================================================= */
.field{margin-bottom:13px}
.field>label{
  display:block;font-size:11.5px;font-weight:800;
  color:var(--ink-soft);margin-bottom:5px;
  letter-spacing:.2px;
}
.field input,.field select,.field textarea{
  width:100%;
  padding:10px 13px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:#fafbfc;
  font-size:13px;
  color:var(--ink);
  transition:all .2s var(--ease);
  font-family:inherit;
  min-height:42px;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--blue);background:#fff;
  box-shadow:0 0 0 3px rgba(10,102,194,.1);
}
.field textarea{resize:vertical;min-height:70px;line-height:1.7;padding-top:11px}
.field .hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}

.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.check{
  display:flex;align-items:center;gap:9px;
  cursor:pointer;font-size:13px;font-weight:600;
  color:var(--ink-soft);
  padding:9px;border-radius:8px;
  transition:background .15s;
  line-height:1.4;
}
.check:hover{background:#f8fafc}
.check input{
  width:18px;height:18px;
  min-height:auto;
  margin:0;flex-shrink:0;
  accent-color:var(--blue);
  cursor:pointer;
}

/* =========================================================
   9. Stats Grid
   ========================================================= */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-bottom:20px;
}
.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 18px;
  display:flex;align-items:center;gap:13px;
  min-width:0;
}
.stat .ic{
  width:42px;height:42px;
  border-radius:11px;
  background:var(--blue-soft);
  color:var(--blue);
  display:grid;place-items:center;
  font-size:17px;flex-shrink:0;
}
.stat .ic.green{background:var(--ok-soft);color:var(--ok)}
.stat .ic.orange{background:var(--warn-soft);color:var(--warn)}
.stat .ic.purple{background:var(--purple-soft);color:var(--purple)}
.stat .info{min-width:0}
.stat .num{
  font-size:22px;font-weight:900;
  line-height:1.1;color:var(--ink);
}
.stat .lbl{
  font-size:11.5px;color:var(--muted);
  font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* =========================================================
   10. Item List
   ========================================================= */
.items{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:12px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:#fafbfc;
  transition:all .2s;
  min-width:0;
}
.item:hover{border-color:var(--blue);background:#fff}
.item .thumb{
  width:52px;height:52px;
  border-radius:9px;
  overflow:hidden;
  background:#e2e8f0;
  display:grid;place-items:center;
  color:var(--muted);font-size:16px;
  flex-shrink:0;
}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .info{flex:1;min-width:0}
.item .info strong{
  display:block;font-size:13.5px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.4;
}
.item .info small{
  font-size:11.5px;color:var(--muted);
  display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.5;
  margin-top:2px;
}
.item .actions{display:flex;gap:5px;flex-shrink:0}

/* =========================================================
   11. Empty
   ========================================================= */
.empty{
  text-align:center;
  padding:48px 20px;
  border:2px dashed var(--line);
  border-radius:var(--radius);
  background:#fafbfc;
  color:var(--muted);
}
.empty i{
  font-size:30px;color:#cbd5e1;
  display:block;margin-bottom:10px;
}
.empty strong{
  display:block;color:var(--ink-soft);
  font-weight:800;margin-bottom:4px;
}

/* =========================================================
   12. Drop Zone & Thumbs
   ========================================================= */
.drop{
  border:2px dashed var(--line);
  border-radius:var(--radius);
  padding:22px;
  text-align:center;
  background:#fafbfc;
  cursor:pointer;
  transition:all .25s;
}
.drop:hover,.drop.is-over{border-color:var(--blue);background:var(--blue-soft)}
.drop i{font-size:22px;color:var(--blue);display:block;margin-bottom:6px}
.drop strong{display:block;font-size:12.5px;margin-bottom:2px}
.drop small{font-size:11px;color:var(--muted);line-height:1.5;display:block}

.thumbs{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:8px;margin-top:12px;
}
.thumb-box{
  position:relative;
  aspect-ratio:1/1;
  border-radius:9px;
  overflow:hidden;
  border:1.5px solid var(--line);
  background:#f0f4f8;
}
.thumb-box img{width:100%;height:100%;object-fit:cover}
.thumb-box .badge{
  position:absolute;top:5px;right:5px;
  background:rgba(10,22,40,.88);
  color:#fff;font-size:9px;font-weight:800;
  padding:2px 7px;border-radius:20px;
}
.thumb-box .badge.cover{background:var(--blue)}
.thumb-box .badge.new{background:var(--ok)}
.thumb-box .rm{
  position:absolute;top:5px;left:5px;
  width:22px;height:22px;border-radius:50%;
  background:var(--err);color:#fff;
  font-size:9px;display:grid;place-items:center;
  opacity:0;transition:opacity .2s;
}
.thumb-box .mv{
  position:absolute;bottom:5px;left:5px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(10,22,40,.88);color:#fff;
  font-size:9px;display:grid;place-items:center;
  opacity:0;transition:opacity .2s;
}
.thumb-box:hover .rm,
.thumb-box:hover .mv{opacity:1}

/* =========================================================
   13. List Editors
   ========================================================= */
.le{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.le-row{
  display:grid;gap:7px;align-items:center;
  padding:8px;
  background:#f8fafc;
  border-radius:8px;
  border:1px solid var(--line);
  min-width:0;
}
.le-row input{
  padding:8px 10px;
  border-radius:6px;
  border:1px solid var(--line);
  font-size:12.5px;
  width:100%;
  background:#fff;
  min-height:36px;
  min-width:0;
}
.le-row input:focus{outline:none;border-color:var(--blue)}
.rm-btn{
  width:32px;height:32px;
  border-radius:7px;
  background:var(--err-soft);
  color:var(--err);
  display:grid;place-items:center;
  font-size:11px;flex-shrink:0;
}
.rm-btn:hover{background:var(--err);color:#fff}

/* =========================================================
   14. Block Editor
   ========================================================= */
.block-editor{
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  padding:14px;
  margin-bottom:12px;
  background:#fafbfc;
  min-width:0;
}
.block-editor-h{
  display:flex;align-items:center;gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.block-editor-h input{flex:1;min-width:0;min-height:36px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff}
.block-editor-h select{
  width:auto;min-width:130px;
  padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  font-size:12.5px;background:#fff;min-height:36px;
}
.block-items{display:flex;flex-direction:column;gap:6px}
.block-item-row{
  display:grid;gap:6px;align-items:center;
  padding:7px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  min-width:0;
}
.block-item-row input{
  padding:7px 9px;border-radius:6px;border:1px solid var(--line);
  font-size:12px;width:100%;min-height:34px;min-width:0;
}
.block-item-row input:focus{outline:none;border-color:var(--blue)}

/* =========================================================
   15. Order List
   ========================================================= */
.order-list{display:flex;flex-direction:column;gap:8px}
.order-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 15px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  transition:all .2s;
}
.order-item:hover{border-color:var(--blue)}
.order-item .num{
  width:32px;height:32px;border-radius:50%;
  background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;
  font-weight:900;font-size:13px;
  flex-shrink:0;
}
.order-item .lbl{flex:1;font-weight:700;font-size:13.5px;min-width:0}
.order-item .arrows{display:flex;gap:4px;flex-shrink:0}
.order-item .arrows button{
  width:32px;height:32px;
  border-radius:7px;
  background:#f1f5f9;color:var(--ink-soft);
  display:grid;place-items:center;
  font-size:11px;transition:all .2s;
}
.order-item .arrows button:hover:not(:disabled){background:var(--blue);color:#fff}
.order-item .arrows button:disabled{opacity:.3;cursor:not-allowed}

/* =========================================================
   16. Modal
   ========================================================= */
.modal{
  position:fixed;inset:0;z-index:200;
  display:grid;place-items:center;
  padding:16px;
  opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.modal.is-open{opacity:1;pointer-events:auto}
.modal-bg{
  position:absolute;inset:0;
  background:rgba(10,22,40,.6);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.modal-box{
  position:relative;
  width:min(800px,100%);
  max-height:92vh;
  max-height:92dvh;
  overflow-y:auto;
  background:#fff;
  border-radius:var(--radius);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
  transform:scale(.96);
  transition:transform .25s var(--ease);
  display:flex;flex-direction:column;
}
.modal.is-open .modal-box{transform:scale(1)}
.modal-h{
  position:sticky;top:0;background:#fff;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--line);
  border-radius:var(--radius) var(--radius) 0 0;
  flex-shrink:0;
}
.modal-h h3{
  font-size:15px;font-weight:900;
  display:flex;align-items:center;gap:9px;
  min-width:0;
}
.modal-h h3 i{color:var(--blue);flex-shrink:0}
.modal-close{
  width:34px;height:34px;border-radius:50%;
  background:var(--bg);
  display:grid;place-items:center;
  font-size:12px;color:var(--ink-soft);
  transition:all .2s;flex-shrink:0;
}
.modal-close:hover{background:var(--err);color:#fff}
.modal-b{padding:20px;overflow-y:auto;flex:1;min-height:0}
.modal-f{
  position:sticky;bottom:0;background:#fff;
  display:flex;justify-content:flex-end;gap:8px;
  padding:14px 20px;
  border-top:1px solid var(--line);
  border-radius:0 0 var(--radius) var(--radius);
  flex-shrink:0;
  flex-wrap:wrap;
}

/* =========================================================
   17. Log
   ========================================================= */
.log{
  background:#0a1628;color:#94a3b8;
  font-family:'SF Mono',Menlo,monospace;
  font-size:11.5px;padding:12px 14px;
  border-radius:var(--radius);margin-top:12px;
  max-height:200px;overflow-y:auto;
  display:none;
  white-space:pre-wrap;word-break:break-word;
}
.log.is-open{display:block}
.log-line{padding:1px 0;line-height:1.5}
.log-line.ok{color:#4ade80}
.log-line.err{color:#f87171}
.log-line.info{color:#60a5fa}
.log-line.warn{color:#fbbf24}

/* =========================================================
   18. Toast
   ========================================================= */
.toast{
  position:fixed;bottom:22px;left:50%;
  transform:translateX(-50%) translateY(120px);
  background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:40px;
  font-size:13px;font-weight:700;
  box-shadow:0 20px 40px -10px rgba(0,0,0,.3);
  opacity:0;transition:all .35s var(--ease);
  z-index:999;max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:9px;
  pointer-events:none;
}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* =========================================================
   19. Backdrop (mobile sidebar)
   ========================================================= */
.backdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  z-index:55;
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
.backdrop.is-on{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* =========================================================
   20. Responsive Breakpoints
   ========================================================= */

/* === Large Laptop (1200-1400px) — ضبط بسيط === */
@media (max-width:1400px){
  .main{max-width:100%}
}

/* === Laptop (1024-1200px) — تصغير الحواف === */
@media (max-width:1200px){
  :root{--sidebar-w:230px}

}

/* === Tablet (768-1024px) — الشريط الجانبي يصبح Drawer === */
@media (max-width:1024px){
  body{
    grid-template-columns:1fr;
    grid-template-areas:"top" "main";
  }
  .sb{

@media (max-width:768px){

/* === Phone (<560px) === */
@media (max-width:560px){

<script>
/* =========================================================
   Globals
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

const SETTINGS_KEY = 'portfolio-admin-settings-v3';
const DATA_PATH = 'js/data.js';

const S = {
  settings: {},
  data: { SITE:{}, PRODUCTS_3D:[], WEB_PROJECTS:[] },
  sha: null,
  dirty: false,
  section: 'dashboard',
  pendingImages: [],
  editingCtx: null
};

/* =========================================================
   Helpers
   ========================================================= */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const slugify = s => String(s||'').trim().toLowerCase()
  .replace(/[^\w\u0600-\u06FF]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-');

const fmtB = b => b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';

function toast(msg, type='') {
  const t = $('#toast');
  const icons = { ok:'check-circle', err:'circle-exclamation', warn:'triangle-exclamation' };
  t.innerHTML = `<i class="fas fa-${icons[type]||'circle-info'}"></i> ${esc(msg)}`;
  t.className = 'toast is-on ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('is-on'), 3200);
}

function log(msg, type='info') {
  const el = $('#log');
  el.classList.add('is-open');
  const time = new Date().toLocaleTimeString('ar-EG',{hour12:false});
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = `[${time}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function markDirty() {
  S.dirty = true;
  $('#statusPill').className = 'pill dirty';
  $('#statusPill').innerHTML = '<span class="dot"></span> تغييرات غير منشورة';
  $('#sb-status').textContent = '● تغييرات معلّقة';
}
function markSaved() {
  S.dirty = false;
  $('#statusPill').className = 'pill saved';
  $('#statusPill').innerHTML = '<span class="dot"></span> محفوظ';
  $('#sb-status').textContent = '✓ محفوظ';
}

function isMobileDrawer(){ return window.matchMedia('(max-width:1024px)').matches; }
function openSidebar(){
  $('#sb').classList.add('is-open');
  $('#backdrop').classList.add('is-on');
}
function closeSidebar(){
  $('#sb').classList.remove('is-open');
  $('#backdrop').classList.remove('is-on');
}

/* =========================================================
   Settings
   ========================================================= */
function loadSettings() {
  try { S.settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'); } catch(e){ S.settings = {}; }
  S.settings.owner   = S.settings.owner   || 'theralaugh';
  S.settings.repo    = S.settings.repo    || 'two';
  S.settings.branch  = S.settings.branch  || 'main';
  S.settings.token   = S.settings.token   || '';
}
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S.settings)); }

/* =========================================================
   GitHub API
   ========================================================= */
async function gh(path, opts={}) {
  const { owner, repo, token } = S.settings;
  if (!token) throw new Error('التوكن غير مضبوط');
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers: {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: opts.body
  });
  if (opts.method && opts.method !== 'GET' && (res.status === 200 || res.status === 201)) return res.json();
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function fetchData() {
  const data = await gh(`${DATA_PATH}?ref=${S.settings.branch}`);
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
  S.sha = data.sha;
  const sandbox = { window:{} };
  try { new Function('window', content)(sandbox.window); }
  catch(e){ throw new Error('فشل تحليل data.js: ' + e.message); }
  S.data = {
    SITE: sandbox.window.SITE || {},
    PRODUCTS_3D: sandbox.window.PRODUCTS_3D || [],
    WEB_PROJECTS: sandbox.window.WEB_PROJECTS || []
  };
}

function serializeData() {
  const d = S.data;
  return `/* =========================================================
   Portfolio Data — يُدار عبر admin.html
   آخر تحديث: ${new Date().toISOString()}
   ========================================================= */

window.SITE = ${JSON.stringify(d.SITE, null, 2)};

window.PRODUCTS_3D = ${JSON.stringify(d.PRODUCTS_3D, null, 2)};

window.WEB_PROJECTS = ${JSON.stringify(d.WEB_PROJECTS, null, 2)};
`;
}

async function uploadFile(path, blob, message) {
  const b64 = await blobToBase64(blob);
  return gh(path, {
    method: 'PUT',
    body: JSON.stringify({ message, content: b64, branch: S.settings.branch })
  });
}

async function publishDataJS() {
  const content = serializeData();
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const body = {
    message: `Update portfolio data — ${new Date().toLocaleString('ar-EG')}`,
    content: b64,
    branch: S.settings.branch,
    sha: S.sha
  };
  return gh(DATA_PATH, { method: 'PUT', body: JSON.stringify(body) });
}

function blobToBase64(blob) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });
}

/* =========================================================
   Publish
   ========================================================= */
async function publish() {
  const btn = $('#publishBtn');
  btn.disabled = true;
  $('#log').innerHTML = '';
  try {
    log('بدء النشر...', 'info');
    for (const im of S.pendingImages) {
      log(`رفع ${im.path} (${fmtB(im.size)})...`, 'info');
      await uploadFile(im.path, im.blob, `Upload ${im.path}`);
      log(`✔ ${im.path}`, 'ok');
    }
    S.pendingImages = [];

    log('تحديث data.js...', 'info');
    await publishDataJS();
    log('✔ تم تحديث data.js', 'ok');

    await fetchData();

    markSaved();
    updateBadges();
    log('🎉 اكتمل النشر — انتظر 1-2 دقيقة', 'ok');
    toast('تم النشر بنجاح', 'ok');
  } catch (e) {
    log('✘ ' + e.message, 'err');
    toast('فشل: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

/* =========================================================
   Image processing
   ========================================================= */
function processImage(file, maxSize = 1600, q = 0.85) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        const r = Math.min(maxSize/width, maxSize/height);
        width = Math.round(width*r); height = Math.round(height*r);
      }
      const c = document.createElement('canvas');
      c.width = width; c.height = height;
      c.getContext('2d').drawImage(img, 0, 0, width, height);
      c.toBlob(b => {
        URL.revokeObjectURL(url);
        res({ blob: b, width, height, size: b.size });
      }, 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('فشل تحميل الصورة')); };
    img.src = url;
  });
}

/* =========================================================
   Navigation
   ========================================================= */
function navigate(sec) {
  S.section = sec;
  $$('.sb-item').forEach(i => i.classList.toggle('is-active', i.dataset.sec === sec));
  $('#pageTitle').textContent = {
    dashboard:'الرئيسية', meta:'العلامة والـ Meta', hero:'Hero',
    about:'من أنا', contact:'التواصل', order:'ترتيب الأقسام',
    products:'منتجات 3D', projects:'مشاريع الويب', cats:'الأصناف',
    cv:'تصدير CV', settings:'الإعدادات', io:'نسخ/استيراد'
  }[sec] || '';
  if (isMobileDrawer()) closeSidebar();
  render();
}

/* =========================================================
   Render dispatcher
   ========================================================= */
function render() {
  const r = {
    dashboard: renderDashboard, meta: renderMeta,
    hero: renderHero, about: renderAbout, contact: renderContact,
    order: renderOrder, products: renderProducts, projects: renderProjects,
    cats: renderCats, cv: renderCV,
    settings: renderSettings, io: renderIO
  }[S.section];
  $('#main').innerHTML = r ? r() : '';
  bindEvents();
}

function updateBadges() {
  $('#bg3d').textContent = S.data.PRODUCTS_3D.length;
  $('#bgweb').textContent = S.data.WEB_PROJECTS.length;
}

/* =========================================================
   Section: Dashboard
   ========================================================= */
function renderDashboard() {
  const d = S.data;
  return `
    <h1 class="sec-title"><i class="fas fa-home"></i> مرحباً بك</h1>
    <p class="sec-desc">تحكم كامل في البورتفوليو — كل تعديل يُحفظ في المتصفح حتى تنشر.</p>

    <div class="stats">
      <div class="stat"><div class="ic"><i class="fas fa-cube"></i></div>
        <div class="info"><div class="num">${d.PRODUCTS_3D.length}</div><div class="lbl">منتج 3D</div></div></div>
      <div class="stat"><div class="ic purple"><i class="fas fa-code"></i></div>
        <div class="info"><div class="num">${d.WEB_PROJECTS.length}</div><div class="lbl">مشروع ويب</div></div></div>

function renderBlockEditor(b, i) {
  const types = [
    { id:'chips', label:'وسوم (Chips)' },
    { id:'list', label:'قائمة (عنوان + وصف)' },
    { id:'languages', label:'لغات (اسم + مستوى + %)' },
    { id:'text', label:'نص حر' }
  ];
  let itemsHtml = '';
  if (b.type === 'chips') {
    itemsHtml = `
      <div class="block-items">
        ${(b.items||[]).map((it, j) => `
          <div class="block-item-row" style="grid-template-columns:1fr auto">
            <input type="text" value="${esc(it)}" data-bidx="${i}" data-item="${j}" data-ik="v" placeholder="مثال: Blender" />
            <button class="rm-btn" data-rmitem="${i}-${j}"><i class="fas fa-times"></i></button>
          </div>`).join('')}
      </div>
      <button class="btn btn-sm btn-ghost" data-additem="${i}" style="margin-top:8px"><i class="fas fa-plus"></i> عنصر</button>
    `;
  } else if (b.type === 'list') {
    itemsHtml = `
      <div class="block-items">
        ${(b.items||[]).map((it, j) => `
          <div class="block-item-row" style="grid-template-columns:1fr 1fr auto">
            <input type="text" value="${esc(it.title||'')}" data-bidx="${i}" data-item="${j}" data-ik="title" placeholder="العنوان" />
            <input type="text" value="${esc(it.subtitle||'')}" data-bidx="${i}" data-item="${j}" data-ik="subtitle" placeholder="الوصف" />
            <button class="rm-btn" data-rmitem="${i}-${j}"><i class="fas fa-times"></i></button>
          </div>`).join('')}
      </div>
      <button class="btn btn-sm btn-ghost" data-additem="${i}" style="margin-top:8px"><i class="fas fa-plus"></i> عنصر</button>
    `;
  } else if (b.type === 'languages') {
    itemsHtml = `
      <div class="block-items">
        ${(b.items||[]).map((it, j) => `
          <div class="block-item-row" style="grid-template-columns:1fr 100px 80px auto">
            <input type="text" value="${esc(it.name||'')}" data-bidx="${i}" data-item="${j}" data-ik="name" placeholder="اللغة" />
            <input type="text" value="${esc(it.level||'')}" data-bidx="${i}" data-item="${j}" data-ik="level" placeholder="مستوى" />
            <input type="number" min="0" max="100" value="${it.percent||0}" data-bidx="${i}" data-item="${j}" data-ik="percent" placeholder="%" />
            <button class="rm-btn" data-rmitem="${i}-${j}"><i class="fas fa-times"></i></button>
          </div>`).join('')}
      </div>
      <button class="btn btn-sm btn-ghost" data-additem="${i}" style="margin-top:8px"><i class="fas fa-plus"></i> لغة</button>
    `;
  } else if (b.type === 'text') {
    itemsHtml = `
      <div class="field"><label>النص</label>
        <textarea style="min-height:90px" data-bidx="${i}" data-btext="1">${esc(b.content||'')}</textarea></div>
    `;
  }

  return `
    <div class="block-editor">
      <div class="block-editor-h">
        <input type="text" value="${esc(b.icon||'fa-star')}" data-bidx="${i}" data-bk="icon" placeholder="fa-star" style="max-width:120px" />
        <input type="text" value="${esc(b.title||'')}" data-bidx="${i}" data-bk="title" placeholder="عنوان البلوك" />
        <select data-bidx="${i}" data-bk="type">
          ${types.map(t => `<option value="${t.id}" ${b.type===t.id?'selected':''}>${t.label}</option>`).join('')}
        </select>
        <button class="rm-btn" data-rmblock="${i}"><i class="fas fa-trash"></i></button>
      </div>
      ${itemsHtml}
    </div>
  `;
}

              <button class="btn btn-xs btn-ghost" data-mvweb="${i}" data-dir="-1" ${i===0?'disabled':''}><i class="fas fa-arrow-up"></i></button>
              <button class="btn btn-xs btn-ghost" data-mvweb="${i}" data-dir="1" ${i===list.length-1?'disabled':''}><i class="fas fa-arrow-down"></i></button>
              <button class="btn btn-xs btn-ghost" onclick="editProjectWeb(${i})"><i class="fas fa-pen"></i></button>
              <button class="btn btn-xs btn-danger" onclick="deleteProjectWeb(${i})"><i class="fas fa-trash"></i></button>
            </div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

/* =========================================================
   Bind Events
   ========================================================= */
function bindEvents() {
  const sec = S.section;

  if (sec === 'meta') {
    const m = S.data.SITE.meta = S.data.SITE.meta || {};
    bindInput('m-init', v => { m.brandInitial = v; });
    bindInput('m-name', v => { m.brandName = v; });
    bindInput('m-sub', v => { m.brandSub = v; });
    bindInput('m-title', v => { m.title = v; });
    bindInput('m-desc', v => { m.description = v; });
  }

  if (sec === 'hero') {
    const h = S.data.SITE.hero = S.data.SITE.hero || {};
    bindInput('h-badge', v => { h.badge = v; });
    bindInput('h-title', v => { h.titleHtml = v; });
    bindInput('h-sub', v => { h.subtitle = v; });
    h.ctaPrimary = h.ctaPrimary || {};
    h.ctaSecondary = h.ctaSecondary || {};
    bindInput('hc1-label', v => h.ctaPrimary.label = v);
    bindInput('hc1-icon', v => h.ctaPrimary.icon = v);
    bindInput('hc1-href', v => h.ctaPrimary.href = v);
    bindInput('hc2-label', v => h.ctaSecondary.label = v);
    bindInput('hc2-icon', v => h.ctaSecondary.icon = v);
    bindInput('hc2-href', v => h.ctaSecondary.href = v);

    h.stats = h.stats || [];
    $('#addStat')?.addEventListener('click', () => { h.stats.push({value:'0',label:'جديد'}); markDirty(); render(); });
    $$('[data-stat]').forEach(inp => inp.addEventListener('input', () => {
      h.stats[+inp.dataset.stat][inp.dataset.k] = inp.value; markDirty();
    }));
    $$('[data-rmstat]').forEach(b => b.addEventListener('click', () => {
      h.stats.splice(+b.dataset.rmstat,1); markDirty(); render();
    }));

    h.metaLinks = h.metaLinks || [];
    $('#addMeta2')?.addEventListener('click', () => { h.metaLinks.push({icon:'fa-link',label:'',href:'#'}); markDirty(); render(); });
    $$('[data-meta2]').forEach(inp => inp.addEventListener('input', () => {
      h.metaLinks[+inp.dataset.meta2][inp.dataset.k] = inp.value; markDirty();
    }));
    $$('[data-rmmeta2]').forEach(b => b.addEventListener('click', () => {
      h.metaLinks.splice(+b.dataset.rmmeta2,1); markDirty(); render();
    }));
  }

  if (sec === 'about') {
    const a = S.data.SITE.about = S.data.SITE.about || {};
    bindInput('a-eb', v => a.eyebrow = v);
    bindInput('a-t', v => a.title = v);
    bindInput('a-bio', v => a.bio = v);
    a.blocks = a.blocks || [];

    $('#addBlock')?.addEventListener('click', () => {
      a.blocks.push({ id: 'block-'+Date.now(), icon:'fa-star', title:'بلوك جديد', type:'chips', items:[] });
      markDirty(); render();
    });

    $$('[data-bk]').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = +inp.dataset.bidx, k = inp.dataset.bk;
        if (k === 'type') {
          a.blocks[i].type = inp.value;
          if (inp.value === 'text') a.blocks[i].content = a.blocks[i].content || '';
          else a.blocks[i].items = a.blocks[i].items || [];
          markDirty(); render();
        } else {
          a.blocks[i][k] = inp.value; markDirty();
        }
      });
      inp.addEventListener('change', () => {
        if (inp.dataset.bk === 'type') {
          const i = +inp.dataset.bidx;
          a.blocks[i].type = inp.value;
          if (inp.value === 'text') a.blocks[i].content = a.blocks[i].content || '';
          else if (!a.blocks[i].items) a.blocks[i].items = [];
          markDirty(); render();
        }
      });
    });

    $$('[data-btext]').forEach(t => t.addEventListener('input', () => {
      a.blocks[+t.dataset.bidx].content = t.value; markDirty();
    }));

    $$('[data-ik]').forEach(inp => inp.addEventListener('input', () => {
      const i = +inp.dataset.bidx, j = +inp.dataset.item, k = inp.dataset.ik;
      if (k === 'v') a.blocks[i].items[j] = inp.value;
      else a.blocks[i].items[j][k] = (k === 'percent' ? +inp.value : inp.value);
      markDirty();
    }));

    $$('[data-additem]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.additem;
      const type = a.blocks[i].type;
      a.blocks[i].items = a.blocks[i].items || [];
      if (type === 'chips') a.blocks[i].items.push('');
      else if (type === 'list') a.blocks[i].items.push({title:'', subtitle:''});
      else if (type === 'languages') a.blocks[i].items.push({name:'', level:'', percent:50});
      markDirty(); render();
    }));

    $$('[data-rmitem]').forEach(b => b.addEventListener('click', () => {
      const [i,j] = b.dataset.rmitem.split('-').map(Number);
      a.blocks[i].items.splice(j,1); markDirty(); render();
    }));

    $$('[data-rmblock]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('حذف هذا البلوك؟')) return;
      a.blocks.splice(+b.dataset.rmblock,1); markDirty(); render();
    }));
  }

  if (sec === 'contact') {
    const c = S.data.SITE.contact = S.data.SITE.contact || {};
    bindInput('c-title', v => c.title = v);
    bindInput('c-sub', v => c.subtitle = v);
    bindInput('c-email', v => c.email = v);
    bindInput('c-wa', v => c.whatsapp = v);
    bindInput('c-gh', v => c.github = v);
    bindInput('c-web', v => c.website = v);
  }

  if (sec === 'order') {
    $$('[data-mv]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.mv, dir = +b.dataset.dir;
      const o = S.data.SITE.order || [];
      const j = i + dir;
      if (j < 0 || j >= o.length) return;
      [o[i], o[j]] = [o[j], o[i]];
      S.data.SITE.order = o;
      markDirty(); render();
    }));
  }

  if (sec === 'cats') {
    S.data.SITE.categories3d = S.data.SITE.categories3d || [];
    S.data.SITE.categoriesWeb = S.data.SITE.categoriesWeb || [];

    $('#addCat3d')?.addEventListener('click', () => {
      S.data.SITE.categories3d.push({ id:'new-'+Date.now().toString(36), label:'صنف جديد' });
      markDirty(); render();
    });
    $('#addCatWeb')?.addEventListener('click', () => {
      S.data.SITE.categoriesWeb.push({ id:'new-'+Date.now().toString(36), label:'صنف جديد' });
      markDirty(); render();
    });

    $$('[data-cat3d]').forEach(inp => inp.addEventListener('input', () => {
      S.data.SITE.categories3d[+inp.dataset.cat3d][inp.dataset.k] = inp.value; markDirty();
    }));
    $$('[data-catweb]').forEach(inp => inp.addEventListener('input', () => {
      S.data.SITE.categoriesWeb[+inp.dataset.catweb][inp.dataset.k] = inp.value; markDirty();
    }));
    $$('[data-rmcat3d]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('حذف الصنف؟ (لن تُحذف المنتجات المرتبطة به)')) return;
      S.data.SITE.categories3d.splice(+b.dataset.rmcat3d,1); markDirty(); render();
    }));
    $$('[data-rmcatweb]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('حذف الصنف؟')) return;
      S.data.SITE.categoriesWeb.splice(+b.dataset.rmcatweb,1); markDirty(); render();
    }));
  }

  if (sec === 'products') {
    $$('[data-mv3d]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.mv3d, dir = +b.dataset.dir;
      const list = S.data.PRODUCTS_3D, j = i + dir;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      markDirty(); render();
    }));
  }

  if (sec === 'projects') {
    $$('[data-mvweb]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.mvweb, dir = +b.dataset.dir;
      const list = S.data.WEB_PROJECTS, j = i + dir;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      markDirty(); render();
    }));
  }

  if (sec === 'settings') {
    $('#saveSet')?.addEventListener('click', () => {
      S.settings.owner = $('#s-owner').value.trim();
      S.settings.repo = $('#s-repo').value.trim();
      S.settings.branch = $('#s-branch').value.trim() || 'main';
      S.settings.token = $('#s-token').value.trim();
      saveSettings();
      toast('تم حفظ الإعدادات', 'ok');
    });
    $('#testConn')?.addEventListener('click', async () => {
      try {
        S.settings.owner = $('#s-owner').value.trim();
        S.settings.repo = $('#s-repo').value.trim();
        S.settings.branch = $('#s-branch').value.trim() || 'main';
        S.settings.token = $('#s-token').value.trim();
        saveSettings();
        log('اختبار الاتصال...', 'info');
        await fetchData();
        updateBadges();
        log('✔ متصل بنجاح', 'ok');
        toast('الاتصال ناجح', 'ok');
      } catch (e) { log('✘ ' + e.message, 'err'); toast('فشل: '+e.message, 'err'); }
    });
  }

  if (sec === 'io') {
    $('#exportFull')?.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(S.data, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `portfolio-backup-${Date.now()}.json`; a.click();
      URL.revokeObjectURL(url);
      toast('تم التصدير', 'ok');
    });
    $('#importFile')?.addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      if (!confirm('استبدال كل البيانات الحالية؟')) return;
      try {
        const json = JSON.parse(await f.text());
        S.data = {
          SITE: json.SITE || {},
          PRODUCTS_3D: json.PRODUCTS_3D || [],
          WEB_PROJECTS: json.WEB_PROJECTS || []
        };
        markDirty(); updateBadges(); render();
        toast('تم الاستيراد', 'ok');
      } catch (err) { toast('فشل: '+err.message, 'err'); }
    });
  }

  if (sec === 'cv') {
    const opts = ['hero','bio','skills3d','skillsWeb','education','languages','soft','products','projects','photo','color'];
    opts.forEach(k => {
      const el = $('#cv-'+k);
      if (el) el.addEventListener('change', () => {
        const o = JSON.parse(localStorage.getItem('cv-options') || '{}');
        o[k] = el.checked; localStorage.setItem('cv-options', JSON.stringify(o));
      });
    });
    $('#cvPreview')?.addEventListener('click', () => {
      const o = readCVOptions(); localStorage.setItem('cv-options', JSON.stringify(o));
      window.open(`cv.html?${new URLSearchParams(o).toString()}`, '_blank');
    });
    $('#cvPdf')?.addEventListener('click', () => {
      const o = readCVOptions(); localStorage.setItem('cv-options', JSON.stringify(o));
      const w = window.open(`cv.html?${new URLSearchParams(o).toString()}&print=1`, '_blank');
      if (!w) toast('افتح النوافذ المنبثقة', 'err');
    });
    $('#cvHtml')?.addEventListener('click', async () => {
      const o = readCVOptions(); localStorage.setItem('cv-options', JSON.stringify(o));
      const res = await fetch(`cv.html?${new URLSearchParams(o).toString()}`);
      const html = await res.text();
      const blob = new Blob([html], { type:'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'cv.html'; a.click();
      URL.revokeObjectURL(url);
    });
  }
}

function readCVOptions() {
  const o = {};
  ['hero','bio','skills3d','skillsWeb','education','languages','soft','products','projects','photo','color']
    .forEach(k => { const el = $('#cv-'+k); if (el) o[k] = el.checked; });
  return o;
}

function bindInput(id, fn) {
  const el = $('#'+id);
  el?.addEventListener('input', () => { fn(el.value); markDirty(); });
}

/* =========================================================
   Product 3D Editor
   ========================================================= */
window.startNew3D = () => open3D(null);
window.editProduct3D = (i) => open3D(i);

function open3D(idx) {
  const isNew = idx === null;
  const p = isNew
    ? { id:'', name:'', category:(S.data.SITE.categories3d?.[0]?.id || 'product'), tag:'', cover:'', gallery:[], short:'', description:'', software:['Blender'], render:'', polys:'', time:'', details:[] }
    : JSON.parse(JSON.stringify(S.data.PRODUCTS_3D[idx]));

  S.editingCtx = { type:'3d', idx };
  S.pendingImages = [];

  const cats = S.data.SITE.categories3d || [];
  const body = `
    <div class="row-2">
      <div class="field"><label>الاسم *</label><input type="text" id="e-name" value="${esc(p.name)}" /></div>
      <div class="field"><label>المعرّف (Slug)</label><input type="text" id="e-id" value="${esc(p.id)}" /></div>
    </div>
    <div class="row-2">
      <div class="field"><label>الفئة</label>
        <select id="e-cat">${cats.map(c => `<option value="${esc(c.id)}" ${p.category===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select></div>
      <div class="field"><label>الوسم (Tag)</label><input type="text" id="e-tag" value="${esc(p.tag)}" /></div>
    </div>
    <div class="field"><label>وصف قصير *</label><input type="text" id="e-short" value="${esc(p.short)}" /></div>
    <div class="field"><label>الوصف الكامل</label><textarea id="e-desc" style="min-height:90px">${esc(p.description)}</textarea></div>
    <div class="row-2">
      <div class="field"><label>البرامج (بفاصلة)</label><input type="text" id="e-sw" value="${esc((p.software||[]).join(', '))}" /></div>
      <div class="field"><label>نوع الرندر</label><input type="text" id="e-render" value="${esc(p.render)}" /></div>
    </div>
    <div class="row-2">
      <div class="field"><label>المضلعات</label><input type="text" id="e-polys" value="${esc(p.polys)}" /></div>
      <div class="field"><label>المدة</label><input type="text" id="e-time" value="${esc(p.time)}" /></div>
    </div>
    <div class="field"><label>تفاصيل تقنية (سطر لكل نقطة)</label><textarea id="e-det" style="min-height:90px">${esc((p.details||[]).join('\n'))}</textarea></div>

    <div class="field"><label>الصور</label>
      <div class="drop" id="e-drop">
        <i class="fas fa-cloud-arrow-up"></i>
        <strong>اسحب الصور أو اضغط</strong>
        <small>الصورة الأولى = الغلاف · تُضغط تلقائياً إلى 1600px</small>
        <input type="file" id="e-file" accept="image/*" multiple hidden />
      </div>
      <div class="thumbs" id="e-thumbs"></div>
    </div>
  `;
  const foot = `
    <button class="btn btn-ghost" data-close>إلغاء</button>
    <button class="btn btn-primary" id="e-save"><i class="fas fa-save"></i> حفظ</button>
  `;
  openModal(isNew?'منتج 3D جديد':'تعديل منتج', 'fa-cube', body, foot);

  const existing = [...(p.gallery || [])];
  renderThumbs();

  function renderThumbs() {
    const c = $('#e-thumbs');
    if (!c) return;
    c.innerHTML = '';
    existing.forEach((src, i) => {
      const d = document.createElement('div');
      d.className = 'thumb-box';
      d.innerHTML = `
        <img src="${esc(src)}" onerror="this.style.opacity=.2" />
        <span class="badge ${i===0?'cover':''}">${i===0?'غلاف':i}</span>
        <button class="rm" data-i="${i}"><i class="fas fa-times"></i></button>
        ${i>0 ? `<button class="mv" data-mv="${i}"><i class="fas fa-arrow-up"></i></button>`:''}`;
      c.appendChild(d);
    });
    S.pendingImages.forEach((im) => {
      const d = document.createElement('div');
      d.className = 'thumb-box';
      d.innerHTML = `<img src="${im.previewURL}" /><span class="badge new">جديد</span>`;
      c.appendChild(d);
    });
    c.querySelectorAll('.rm').forEach(b => b.addEventListener('click', () => {
      existing.splice(+b.dataset.i,1); renderThumbs();
    }));
    c.querySelectorAll('.mv').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.mv;
      [existing[i], existing[i-1]] = [existing[i-1], existing[i]];
      renderThumbs();
    }));
  }

  $('#e-drop').addEventListener('click', () => $('#e-file').click());
  $('#e-file').addEventListener('change', async (e) => {
    for (const f of e.target.files) {
      try {
        const { blob, size } = await processImage(f);
        const idNow = ($('#e-id').value.trim()) || slugify($('#e-name').value) || 'project-'+Date.now();
        const pos = existing.length + S.pendingImages.length;
        const name = pos === 0 ? 'cover.jpg' : `view-${pos}.jpg`;
        S.pendingImages.push({
          blob, size, name,
          path: `assets/3d/${idNow}/${name}`,
          previewURL: URL.createObjectURL(blob)
        });
        renderThumbs();
        log(`✔ ${f.name} → ${name} (${fmtB(size)})`, 'ok');
      } catch (err) { log('✘ ' + err.message, 'err'); }
    }
  });
  ['dragenter','dragover'].forEach(ev => $('#e-drop').addEventListener(ev, e => { e.preventDefault(); $('#e-drop').classList.add('is-over'); }));
  ['dragleave','drop'].forEach(ev => $('#e-drop').addEventListener(ev, e => { e.preventDefault(); $('#e-drop').classList.remove('is-over'); }));
  $('#e-drop').addEventListener('drop', e => {
    if (e.dataTransfer.files.length) {
      const inp = $('#e-file'); inp.files = e.dataTransfer.files;
      inp.dispatchEvent(new Event('change'));
    }
  });

  $('#e-save').addEventListener('click', () => {
    const id = $('#e-id').value.trim() || slugify($('#e-name').value);
    if (!id) return toast('المعرّف مطلوب', 'err');
    if (!$('#e-name').value.trim()) return toast('الاسم مطلوب', 'err');

    S.pendingImages.forEach(im => { im.path = `assets/3d/${id}/${im.name}`; });
    const newPaths = S.pendingImages.map(im => im.path);
    const finalGallery = [...existing, ...newPaths];

    const obj = {
      id,
      name: $('#e-name').value.trim(),
      category: $('#e-cat').value,
      tag: $('#e-tag').value.trim(),
      cover: finalGallery[0] || '',
      gallery: finalGallery,
      short: $('#e-short').value.trim(),
      description: $('#e-desc').value.trim(),
      software: $('#e-sw').value.split(',').map(s=>s.trim()).filter(Boolean),
      render: $('#e-render').value.trim(),
      polys: $('#e-polys').value.trim(),
      time: $('#e-time').value.trim(),
      details: $('#e-det').value.split('\n').map(s=>s.trim()).filter(Boolean)
    };

    if (isNew) S.data.PRODUCTS_3D.unshift(obj);
    else S.data.PRODUCTS_3D[idx] = obj;

    markDirty();
    updateBadges();
    closeModal();
    render();
    toast(isNew?'أضيف المنتج — اضغط نشر':'حُدّث المنتج', 'ok');
  });
}

window.deleteProduct3D = (i) => {
  if (!confirm('حذف هذا المنتج؟ (لن تُحذف الصور من GitHub)')) return;
  S.data.PRODUCTS_3D.splice(i,1); markDirty(); updateBadges(); render();
  toast('تم الحذف — اضغط نشر', 'warn');
};

/* =========================================================
   Web Project Editor
   ========================================================= */
window.startNewWeb = () => openWeb(null);
window.editProjectWeb = (i) => openWeb(i);

function openWeb(idx) {
  const isNew = idx === null;
  const p = isNew
    ? { id:'', name:'', subtitle:'', icon:'fa-code', category:(S.data.SITE.categoriesWeb?.[0]?.id||'tools'), tech:[], desc:'', bullets:[], links:{github:null,demo:null} }
    : JSON.parse(JSON.stringify(S.data.WEB_PROJECTS[idx]));

  S.editingCtx = { type:'web', idx };
  const cats = S.data.SITE.categoriesWeb || [];

  const body = `
    <div class="row-2">
      <div class="field"><label>الاسم *</label><input type="text" id="w-name" value="${esc(p.name)}" /></div>
      <div class="field"><label>المعرّف (Slug)</label><input type="text" id="w-id" value="${esc(p.id)}" /></div>
    </div>
    <div class="row-2">
      <div class="field"><label>الوصف الفرعي</label><input type="text" id="w-sub" value="${esc(p.subtitle)}" /></div>
      <div class="field"><label>الفئة</label>
        <select id="w-cat">${cats.map(c => `<option value="${esc(c.id)}" ${p.category===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select></div>
    </div>
    <div class="row-2">
      <div class="field"><label>أيقونة FontAwesome</label><input type="text" id="w-icon" value="${esc(p.icon)}" /></div>
      <div class="field"><label>التقنيات (بفاصلة)</label><input type="text" id="w-tech" value="${esc((p.tech||[]).join(', '))}" /></div>
    </div>
    <div class="field"><label>الوصف</label><textarea id="w-desc" style="min-height:80px">${esc(p.desc)}</textarea></div>
    <div class="field"><label>النقاط الرئيسية (سطر لكل نقطة)</label><textarea id="w-bul" style="min-height:80px">${esc((p.bullets||[]).join('\n'))}</textarea></div>
    <div class="row-2">
      <div class="field"><label>رابط GitHub</label><input type="text" id="w-gh" value="${esc(p.links?.github||'')}" /></div>
      <div class="field"><label>رابط العرض المباشر</label><input type="text" id="w-demo" value="${esc(p.links?.demo||'')}" /></div>
    </div>
    <label class="check"><input type="checkbox" id="w-private" ${p.private?'checked':''} /> <span>مشروع خاص (لن تظهر الروابط)</span></label>
  `;
  const foot = `
    <button class="btn btn-ghost" data-close>إلغاء</button>
    <button class="btn btn-primary" id="w-save"><i class="fas fa-save"></i> حفظ</button>
  `;
  openModal(isNew?'مشروع ويب جديد':'تعديل مشروع', 'fa-code', body, foot);

  $('#w-save').addEventListener('click', () => {
    const id = $('#w-id').value.trim() || slugify($('#w-name').value);
    if (!id) return toast('المعرّف مطلوب', 'err');
    if (!$('#w-name').value.trim()) return toast('الاسم مطلوب', 'err');
    const isPrivate = $('#w-private').checked;
    const obj = {
      id,
      name: $('#w-name').value.trim(),
      subtitle: $('#w-sub').value.trim(),
      icon: $('#w-icon').value.trim() || 'fa-code',
      category: $('#w-cat').value,
      tech: $('#w-tech').value.split(',').map(s=>s.trim()).filter(Boolean),
      desc: $('#w-desc').value.trim(),
      bullets: $('#w-bul').value.split('\n').map(s=>s.trim()).filter(Boolean),
      links: {
        github: isPrivate ? null : ($('#w-gh').value.trim() || null),
        demo: isPrivate ? null : ($('#w-demo').value.trim() || null)
      }
    };
    if (isPrivate) obj.private = true;
    if (isNew) S.data.WEB_PROJECTS.unshift(obj);
    else S.data.WEB_PROJECTS[idx] = obj;
    markDirty(); updateBadges(); closeModal(); render();
    toast(isNew?'أضيف المشروع':'حُدّث المشروع', 'ok');
  });
}

window.deleteProjectWeb = (i) => {
  if (!confirm('حذف هذا المشروع؟')) return;
  S.data.WEB_PROJECTS.splice(i,1); markDirty(); updateBadges(); render();
  toast('تم الحذف — اضغط نشر', 'warn');
};

/* =========================================================
   Modal
   ========================================================= */
function openModal(title, icon, body, foot) {
  $('#modalTitle').innerHTML = `<i class="fas ${icon}"></i> ${title}`;
  $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = foot || '';
  $('#modal').classList.add('is-open');
  document.body.style.overflow = 'hidden';
  $$('[data-close]').forEach(el => el.onclick = closeModal);
}
function closeModal() {
  $('#modal').classList.remove('is-open');
  document.body.style.overflow = '';
  S.pendingImages = [];
  S.editingCtx = null;
}

/* =========================================================
   Nav & Buttons
   ========================================================= */
$$('.sb-item').forEach(i => i.addEventListener('click', () => navigate(i.dataset.sec)));
$('#menuBtn').addEventListener('click', openSidebar);
$('#sbClose').addEventListener('click', closeSidebar);
$('#backdrop').addEventListener('click', closeSidebar);
$('#publishBtn').addEventListener('click', publish);
$('#reloadBtn').addEventListener('click', async () => {
  if (S.dirty && !confirm('لديك تغييرات غير منشورة. المتابعة؟')) return;
  await boot();
});
window.addEventListener('beforeunload', e => {
  if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
});
// إغلاق الـ sidebar تلقائياً عند تكبير الشاشة
window.addEventListener('resize', () => {
  if (!isMobileDrawer()) closeSidebar();
});

/* =========================================================
   Boot
   ========================================================= */
async function boot() {
  loadSettings();
  if (!S.settings.token) {
    S.data = { SITE:{}, PRODUCTS_3D:[], WEB_PROJECTS:[] };
    navigate('settings');
    return;
  }
  try {
    log('تحميل البيانات من GitHub...', 'info');
    await fetchData();
    updateBadges();
    markSaved();
    navigate('dashboard');
  } catch (e) {
    log('✘ ' + e.message, 'err');
    toast('فشل التحميل: '+e.message, 'err');
    navigate('settings');
  }
}

boot();
</script>
